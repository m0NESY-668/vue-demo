<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏴‍☠️ 寻宝大冒险</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .game-container {
            width: 90%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #ffd700;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: titleGlow 2s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5), 0 0 10px #ffd700; }
            to { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5), 0 0 30px #ffd700, 0 0 40px #ffd700; }
        }

        .adventurer {
            text-align: center;
            font-size: 4em;
            margin: 20px 0;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .path {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 30px 0;
        }

        .step {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            border-left: 4px solid #ffd700;
            opacity: 0;
            transform: translateX(-50px);
            transition: all 0.5s ease;
        }

        .step.active {
            opacity: 1;
            transform: translateX(0);
            animation: pulse 1.5s infinite;
        }

        .step.completed {
            opacity: 1;
            transform: translateX(0);
            border-left-color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }

        .step.failed {
            opacity: 1;
            transform: translateX(0);
            border-left-color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 5px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.8); }
        }

        .step-icon {
            font-size: 2em;
            margin-right: 15px;
        }

        .step-text {
            color: white;
            font-size: 1.1em;
        }

        .controls {
            text-align: center;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 10px;
        }

        .btn-start {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #1e3c72;
            font-weight: bold;
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }

        .btn-start:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .treasure-reward {
            text-align: center;
            font-size: 5em;
            margin: 20px 0;
            display: none;
        }

        .treasure-reward.show {
            display: block;
            animation: treasureAppear 1s ease;
        }

        @keyframes treasureAppear {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); opacity: 1; }
        }

        .status {
            text-align: center;
            color: #ffd700;
            font-size: 1.2em;
            margin: 20px 0;
            min-height: 30px;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffd700;
            border-radius: 50%;
            animation: float 10s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="game-container">
        <h1>🏴‍☠️ 寻宝大冒险</h1>
        
        <div class="adventurer" id="adventurer">🧙‍♂️</div>
        
        <div class="status" id="status">准备好开始冒险了吗？</div>
        
        <div class="path" id="path">
            <div class="step" data-step="0">
                <span class="step-icon">📜</span>
                <span class="step-text">在古老的图书馆寻找线索...</span>
            </div>
            <div class="step" data-step="1">
                <span class="step-icon">🔮</span>
                <span class="step-text">解码神秘古文...</span>
            </div>
            <div class="step" data-step="2">
                <span class="step-icon">🌉</span>
                <span class="step-text">通过危险的吊桥...</span>
            </div>
            <div class="step" data-step="3">
                <span class="step-icon">🥷</span>
                <span class="step-text">避开神庙守护者...</span>
            </div>
            <div class="step" data-step="4">
                <span class="step-icon">📦</span>
                <span class="step-text">在神庙中搜索...</span>
            </div>
            <div class="step" data-step="5">
                <span class="step-icon">🧩</span>
                <span class="step-text">解开古老谜题...</span>
            </div>
            <div class="step" data-step="6">
                <span class="step-icon">👑</span>
                <span class="step-text">打开神秘宝箱...</span>
            </div>
        </div>
        
        <div class="treasure-reward" id="treasure">💎</div>
        
        <div class="controls">
            <button class="btn btn-start" id="startBtn" onclick="startAdventure()">开始寻宝</button>
        </div>
    </div>

    <script>
        // 创建背景粒子效果
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(particle);
            }
        }

        // 模拟宝藏地图API
        class TreasureMap {
            static getInitialClue() {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        resolve({ message: "在古老的图书馆里找到了第一个线索...", icon: "📜" });
                    }, 1500);
                });
            }

            static decodeAncientScript(clue) {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        if (!clue) {
                            reject("没有线索可以解码!");
                        }
                        resolve({ message: "解码成功!宝藏在一座古老的神庙中...", icon: "🔮" });
                    }, 2000);
                });
            }

            static searchTemple(location) {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        const random = Math.random();
                        if (random < 0.3) {
                            reject("糟糕!遇到了神庙守卫!");
                        }
                        resolve({ message: "找到了一个神秘的箱子...", icon: "📦" });
                    }, 2500);
                });
            }

            static solvePuzzle() {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        const random = Math.random();
                        if (random < 0.3) {
                            reject("谜题太难了，无法解开!");
                        }
                        resolve({ message: "成功解开机关!宝箱就在眼前...", icon: "🧩" });
                    }, 2000);
                });
            }

            static openTreasureBox() {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        resolve({ message: "恭喜!你找到了传说中的宝藏!💎", icon: "👑" });
                    }, 1500);
                });
            }

            static encounterGuardian() {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        const random = Math.random();
                        if (random < 0.5) {
                            reject("守护者太强大了，你被击退了!");
                        }
                        resolve({ message: "你巧妙地避开了守护者!", icon: "🥷" });
                    }, 2000);
                });
            }

            static crossBridge() {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        const random = Math.random();
                        if (random < 0.3) {
                            reject("吊桥断了，你掉进了深渊!");
                        }
                        resolve({ message: "小心翼翼地通过了吊桥...", icon: "🌉" });
                    }, 2000);
                });
            }
        }

        // 更新步骤显示
        function updateStep(stepIndex, status) {
            const steps = document.querySelectorAll('.step');
            const step = steps[stepIndex];
            
            if (status === 'active') {
                step.classList.add('active');
                step.classList.remove('completed', 'failed');
            } else if (status === 'completed') {
                step.classList.remove('active');
                step.classList.add('completed');
            } else if (status === 'failed') {
                step.classList.remove('active');
                step.classList.add('failed');
            }
            
            // 滚动到当前步骤
            step.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // 更新状态文本
        function updateStatus(text) {
            document.getElementById('status').textContent = text;
        }

        // 更新冒险者表情
        function updateAdventurer(icon) {
            document.getElementById('adventurer').textContent = icon;
        }

        // 使用 async/await 的寻宝过程
        async function startAdventure() {
            const startBtn = document.getElementById('startBtn');
            startBtn.disabled = true;
            startBtn.textContent = '冒险进行中...';
            
            // 重置所有步骤
            document.querySelectorAll('.step').forEach(step => {
                step.classList.remove('active', 'completed', 'failed');
            });
            document.getElementById('treasure').classList.remove('show');
            
            try {
                updateAdventurer('🧙‍♂️');
                
                // 步骤1: 获取初始线索
                updateStep(0, 'active');
                updateStatus('正在古老的图书馆中寻找线索...');
                const clue = await TreasureMap.getInitialClue();
                updateStep(0, 'completed');
                updateStatus(clue.message);
                
                // 步骤2: 解码古文
                updateStep(1, 'active');
                updateStatus('正在解码神秘的古文...');
                const location = await TreasureMap.decodeAncientScript(clue);
                updateStep(1, 'completed');
                updateStatus(location.message);
                
                // 步骤3: 通过吊桥
                updateAdventurer('🏃');
                updateStep(2, 'active');
                updateStatus('小心翼翼地通过吊桥...');
                const bridge = await TreasureMap.crossBridge();
                updateStep(2, 'completed');
                updateStatus(bridge.message);
                
                // 步骤4: 避开守护者
                updateAdventurer('🥷');
                updateStep(3, 'active');
                updateStatus('守护者出现了!小心躲避...');
                const guardian = await TreasureMap.encounterGuardian();
                updateStep(3, 'completed');
                updateStatus(guardian.message);
                
                // 步骤5: 搜索神庙
                updateAdventurer('🔍');
                updateStep(4, 'active');
                updateStatus('在神庙中仔细搜索...');
                const box = await TreasureMap.searchTemple(location);
                updateStep(4, 'completed');
                updateStatus(box.message);
                
                // 步骤6: 解开谜题
                updateAdventurer('🤔');
                updateStep(5, 'active');
                updateStatus('面对古老的谜题...');
                const puzzle = await TreasureMap.solvePuzzle();
                updateStep(5, 'completed');
                updateStatus(puzzle.message);
                
                // 步骤7: 打开宝箱
                updateAdventurer('🎉');
                updateStep(6, 'active');
                updateStatus('准备打开神秘宝箱...');
                const treasure = await TreasureMap.openTreasureBox();
                updateStep(6, 'completed');
                updateStatus(treasure.message);
                
                // 显示宝藏
                document.getElementById('treasure').classList.add('show');
                updateAdventurer('👑');
                
                startBtn.textContent = '再次冒险';
                startBtn.disabled = false;
                
            } catch (error) {
                updateStatus('💀 任务失败: ' + error);
                updateAdventurer('😵');
                
                // 找到当前活动的步骤并标记为失败
                const activeStep = document.querySelector('.step.active');
                if (activeStep) {
                    activeStep.classList.remove('active');
                    activeStep.classList.add('failed');
                }
                
                startBtn.textContent = '重新挑战';
                startBtn.disabled = false;
            }
        }

        // 初始化
        createParticles();
    </script>
</body>
</html>
